name: teethtech-saas-control
services:
  postgres:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: teethtech_saas
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: ${SAAS_DB_PASSWORD:?Run saasctl.py setup}
    ports: ["127.0.0.1:${SAAS_DB_PORT:-55432}:5432"]
    volumes: ["control_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas -d teethtech_saas"]
      interval: 3s
      retries: 30
    restart: unless-stopped
volumes:
  control_data:
