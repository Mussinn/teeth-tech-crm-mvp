map $http_upgrade $connection_upgrade { default upgrade; '' close; }
resolver 127.0.0.11 valid=10s ipv6=off;
upstream crm_backend { zone crm_backend 64k; server backend:8081 resolve; }
upstream crm_frontend { zone crm_frontend 64k; server frontend:3000 resolve; }
server {
 listen 80;
 client_max_body_size 100m;
 location = /health { access_log off; proxy_pass http://crm_backend/api/v1/actuator/health/readiness; }
 location /api/v1/ws-crm {
  proxy_pass http://crm_backend;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Host $http_host;
  proxy_read_timeout 3600s;
 }
 location / {
  proxy_pass http://crm_frontend;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_read_timeout 120s;
 }
}
